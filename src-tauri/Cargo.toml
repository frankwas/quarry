[package]
name = "quarry"
version = "0.1.0"
description = "Quarry - a modern MySQL client"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["full"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
russh = { version = "0.65.4", default-features = false, features = ["flate2", "ring", "rsa"] }
keyring = "4.2.0"
uuid = { version = "1.29.3", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
anyhow = "1.0.105"
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
